<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c3nsor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-card">
      <header class="ext-pop-top">
        <span class="brand-mark" aria-hidden="true">c3</span>
        <span class="brand-name">c3nsor</span>
        <button
          type="button"
          class="ghost-icon"
          id="refresh-btn"
          title="Re-analyze"
        >
          Refresh
        </button>
      </header>

      <p id="status" class="ext-kicker status" aria-live="polite">Loading…</p>

      <section id="background-banner" class="background-banner hidden">
        <p>
          Turn on red toolbar alerts so c3nsor checks the site while you browse.
          A red number appears on the icon when the policy matches risk
          checkpoints — click for details.
        </p>
        <button type="button" id="enable-background-btn">
          Turn on red alerts
        </button>
      </section>
      <p id="background-on" class="background-on hidden">
        Red alerts on — browse normally; watch the toolbar badge.
      </p>

      <div id="meta" class="ext-head hidden"></div>

      <div id="alternatives" class="alternatives hidden"></div>

      <ul id="findings" class="findings hidden"></ul>

      <section id="guidance" class="guidance hidden"></section>

      <p id="act-label" class="ext-kicker act-label hidden">Act</p>
      <div id="actions" class="ext-acts hidden"></div>

      <section id="manual" class="manual">
        <label for="policy-url">Policy URL (if not found)</label>
        <div class="row">
          <input
            id="policy-url"
            type="url"
            placeholder="https://example.com/privacy"
            autocomplete="off"
          />
          <button type="button" id="analyze-url-btn">Analyze</button>
        </div>
      </section>

      <footer class="foot">
        <button type="button" class="linkish" id="clear-cache-btn">
          Clear cache
        </button>
      </footer>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
