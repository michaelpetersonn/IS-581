<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram is locked</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="panel">
      <p class="brand">Instagram 30-Day Lock</p>
      <h1>Instagram is blocked</h1>

      <p class="hint">
        Open the extension popup to see remaining time, or end the lock early
        with your recovery password.
      </p>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
